<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1350" viewBox="0 0 2200 1350">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#111111"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 44px Arial, sans-serif; fill: #111111; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #444444; }
      .group { fill: #ffffff; stroke: #111111; stroke-width: 3; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.5; }
      .head { fill: #eeeeee; stroke: #111111; stroke-width: 2.5; }
      .groupTitle { font: 800 30px Arial, sans-serif; fill: #111111; }
      .boxTitle { font: 800 24px Arial, sans-serif; fill: #111111; }
      .text { font: 400 21px Arial, sans-serif; fill: #111111; }
      .small { font: 400 18px Arial, sans-serif; fill: #333333; }
      .arrow { stroke: #111111; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #111111; stroke-width: 3; stroke-dasharray: 12 10; fill: none; marker-end: url(#arrow); }
      .labelBox { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .label { font: 700 18px Arial, sans-serif; fill: #111111; }
    </style>
  </defs>

  <rect class="bg" width="2200" height="1350"/>

  <text class="title" x="1100" y="72" text-anchor="middle">Arquitetura do Sistema Cuidado Constante</text>
  <text class="subtitle" x="1100" y="115" text-anchor="middle">Aplicativo mobile, backend serverless, camada IoT e servicos externos</text>

  <!-- Aplicativo -->
  <rect class="group" x="80" y="185" width="560" height="760" rx="10"/>
  <text class="groupTitle" x="360" y="235" text-anchor="middle">Aplicativo Mobile</text>

  <g transform="translate(125,280)">
    <rect class="box" width="470" height="150" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Interface</text>
    <text class="text" x="24" y="88">React Native / Expo</text>
    <text class="text" x="24" y="122">Telas GPS, BLE e configuracoes</text>
  </g>

  <g transform="translate(125,485)">
    <rect class="box" width="470" height="175" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Logica do app</text>
    <text class="text" x="24" y="88">Hooks de GPS e Bluetooth</text>
    <text class="text" x="24" y="122">Services e Supabase SDK</text>
    <text class="text" x="24" y="156">Estado global da aplicacao</text>
  </g>

  <g transform="translate(125,715)">
    <rect class="box" width="470" height="140" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Recursos locais</text>
    <text class="text" x="24" y="88">Fila BLE</text>
    <text class="text" x="24" y="122">Coleira ativa</text>
  </g>

  <!-- Backend -->
  <rect class="group" x="820" y="185" width="560" height="760" rx="10"/>
  <text class="groupTitle" x="1100" y="235" text-anchor="middle">Supabase</text>

  <g transform="translate(865,280)">
    <rect class="box" width="470" height="140" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Auth</text>
    <text class="text" x="24" y="88">Login e cadastro</text>
    <text class="text" x="24" y="122">Recuperacao de senha</text>
  </g>

  <g transform="translate(865,475)">
    <rect class="box" width="470" height="175" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Banco de dados</text>
    <text class="text" x="24" y="88">PostgreSQL</text>
    <text class="text" x="24" y="122">Tabelas GPS, BLE, pets e coleiras</text>
    <text class="text" x="24" y="156">Politicas RLS</text>
  </g>

  <g transform="translate(865,705)">
    <rect class="box" width="470" height="170" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Edge Functions</text>
    <text class="text" x="24" y="88">Pedidos GPS</text>
    <text class="text" x="24" y="122">Ingestao de eventos</text>
    <text class="text" x="24" y="156">Ativacao de coleira</text>
  </g>

  <!-- IoT -->
  <rect class="group" x="1560" y="185" width="560" height="760" rx="10"/>
  <text class="groupTitle" x="1840" y="235" text-anchor="middle">Dispositivo / IoT</text>

  <g transform="translate(1605,280)">
    <rect class="box" width="470" height="150" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Hardware</text>
    <text class="text" x="24" y="88">ESP32-C6</text>
    <text class="text" x="24" y="122">Modulo 4G A7670SA</text>
  </g>

  <g transform="translate(1605,485)">
    <rect class="box" width="470" height="150" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Comunicacao</text>
    <text class="text" x="24" y="88">4G para Supabase</text>
    <text class="text" x="24" y="122">Bluetooth BLE</text>
  </g>

  <g transform="translate(1605,690)">
    <rect class="box" width="470" height="150" rx="8"/>
    <rect class="head" width="470" height="48" rx="8"/>
    <text class="boxTitle" x="24" y="33">Simulador</text>
    <text class="text" x="24" y="88">Consulta pedidos</text>
    <text class="text" x="24" y="122">Envia localizacao</text>
  </g>

  <!-- Externos -->
  <rect class="group" x="320" y="1090" width="1560" height="135" rx="10"/>
  <text class="groupTitle" x="1100" y="1138" text-anchor="middle">Servicos externos</text>

  <rect class="box" x="390" y="1160" width="390" height="48" rx="8"/>
  <text class="text" x="420" y="1191">Google Maps</text>

  <rect class="box" x="855" y="1160" width="390" height="48" rx="8"/>
  <text class="text" x="885" y="1191">Rede 4G</text>

  <rect class="box" x="1320" y="1160" width="390" height="48" rx="8"/>
  <text class="text" x="1350" y="1191">Bluetooth</text>

  <!-- Setas -->
  <path class="arrow" d="M640 565 H820"/>
  <rect class="labelBox" x="665" y="505" width="150" height="38" rx="6"/>
  <text class="label" x="682" y="530">HTTPS/SDK</text>

  <path class="arrow" d="M1380 800 H1560"/>
  <rect class="labelBox" x="1400" y="740" width="150" height="38" rx="6"/>
  <text class="label" x="1417" y="765">Pedido GPS</text>

  <path class="arrow" d="M1560 860 H1380"/>
  <rect class="labelBox" x="1395" y="890" width="160" height="38" rx="6"/>
  <text class="label" x="1408" y="915">GPS/BLE</text>

  <path class="dash" d="M1560 565 H1380"/>
  <rect class="labelBox" x="1395" y="505" width="160" height="38" rx="6"/>
  <text class="label" x="1408" y="530">Assincrono</text>

  <path class="arrow" d="M360 855 V1090"/>
  <rect class="labelBox" x="385" y="980" width="145" height="38" rx="6"/>
  <text class="label" x="402" y="1005">Rotas</text>

  <path class="arrow" d="M1840 840 V1090"/>
  <rect class="labelBox" x="1865" y="980" width="145" height="38" rx="6"/>
  <text class="label" x="1882" y="1005">4G/BLE</text>

  <text class="small" x="1100" y="1300" text-anchor="middle">
    Arquitetura em camadas com app mobile, backend Supabase, dispositivo IoT e servicos externos.
  </text>
</svg>
