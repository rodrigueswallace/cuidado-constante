<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <style>.page{fill:#fff}.title{font:700 28px Arial;fill:#111}.sys{fill:none;stroke:#111;stroke-width:2}.actor{stroke:#111;stroke-width:2;fill:none}.use{fill:#fff;stroke:#111;stroke-width:2}.txt{font:16px Arial;fill:#111}.line{stroke:#111;stroke-width:2;fill:none}</style>
