  <text class="f" x="55" y="355">birth_date</text><text class="f" x="260" y="355">date</text><text class="f" x="470" y="355">Data de nascimento</text>
  <text class="f" x="55" y="385">created_at</text><text class="f" x="260" y="385">timestamptz</text><text class="f" x="470" y="385">Data de cadastro</text>
