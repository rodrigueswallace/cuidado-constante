<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="760" viewBox="0 0 1350 760">
  <style>.bg{fill:#fff}.title{font:700 28px Arial;fill:#111}.tbl{fill:#fff;stroke:#111;stroke-width:2}.head{fill:#e7e6e6;stroke:#111;stroke-width:2}.h{font:700 18px Arial;fill:#111}.f{font:15px Arial;fill:#111}.rel{stroke:#111;stroke-width:2;fill:none}</style>
  <rect class="bg" width="1350" height="760"/>
  <text class="title" x="50" y="55">Modelagem logica - Eventos e pedidos de GPS</text>
  <g transform="translate(520,95)">
    <rect class="tbl" width="330" height="250"/><rect class="head" width="330" height="38"/>
    <text class="h" x="12" y="25">collars</text>
    <text class="f" x="12" y="68">PK id uuid</text><text class="f" x="12" y="94">FK pet_id uuid</text><text class="f" x="12" y="120">serial text unique</text><text class="f" x="12" y="146">activation_code text</text><text class="f" x="12" y="172">ble_service_uuid text</text><text class="f" x="12" y="198">last_seen timestamptz</text><text class="f" x="12" y="224">battery numeric(5,2)</text>
  </g>
  <g transform="translate(70,430)">
    <rect class="tbl" width="330" height="220"/><rect class="head" width="330" height="38"/>
    <text class="h" x="12" y="25">gps_events</text>
    <text class="f" x="12" y="68">PK id uuid</text><text class="f" x="12" y="94">FK collar_id uuid</text><text class="f" x="12" y="120">lat double precision</text><text class="f" x="12" y="146">lng double precision</text><text class="f" x="12" y="172">battery numeric(5,2)</text><text class="f" x="12" y="198">ts, created_at timestamptz</text>
  </g>
  <g transform="translate(520,430)">
    <rect class="tbl" width="330" height="200"/><rect class="head" width="330" height="38"/>
    <text class="h" x="12" y="25">ble_events</text>
    <text class="f" x="12" y="68">PK id uuid</text><text class="f" x="12" y="94">FK collar_id uuid</text><text class="f" x="12" y="120">rssi integer</text><text class="f" x="12" y="146">battery numeric(5,2)</text><text class="f" x="12" y="172">ts, created_at timestamptz</text>
  </g>
  <g transform="translate(970,430)">
    <rect class="tbl" width="330" height="260"/><rect class="head" width="330" height="38"/>
    <text class="h" x="12" y="25">gps_update_requests</text>
    <text class="f" x="12" y="68">PK id uuid</text><text class="f" x="12" y="94">FK collar_id uuid</text><text class="f" x="12" y="120">FK requested_by uuid</text><text class="f" x="12" y="146">status text</text><text class="f" x="12" y="172">requested_at timestamptz</text><text class="f" x="12" y="198">processing_at, completed_at</text><text class="f" x="12" y="224">FK gps_event_id uuid</text><text class="f" x="12" y="250">error text</text>
  </g>
  <path class="rel" d="M685 345 V430"/><text class="f" x="700" y="395">1:N</text>
  <path class="rel" d="M605 345 V375 H235 V430"/><text class="f" x="360" y="365">1:N</text>
  <path class="rel" d="M770 345 V375 H1135 V430"/><text class="f" x="925" y="365">1:N</text>
  <path class="rel" d="M970 560 H400"/><text class="f" x="645" y="548">pedido concluido referencia gps_event</text>
</svg>
